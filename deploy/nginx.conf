# =========================================================================
# nginx для VPS: статика сайта + приём заявок на том же домене
# -------------------------------------------------------------------------
# Положить в /etc/nginx/sites-available/masterskaya, включить симлинком в
# sites-enabled, заменить ДОМЕН на настоящий и проверить: nginx -t
#
# Заявки ходят на /api/ того же домена, а не на отдельный адрес. Это не
# только удобнее: запрос перестаёт быть межсайтовым, и CORS вместе со
# всеми его граблями просто исчезает из картины.
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН www.ДОМЕН;

    # Оставляем открытым только проверку Let's Encrypt, остальное на https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ДОМЕН$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕН/privkey.pem;

    # Один канонический адрес. Иначе поисковик увидит два одинаковых сайта.
    return 301 https://ДОМЕН$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ДОМЕН;

    root /var/www/masterskaya;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕН/privkey.pem;

    # ---- Кодировка ------------------------------------------------------
    # Без этого часть сборок nginx отдаёт русский текст крокозябрами.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    # ---- Загрузка фотографий --------------------------------------------
    # Люди присылают снимки с телефона; при лимите по умолчанию (1 МБ)
    # заявка отвалится с 413 ещё до того, как её увидит обработчик.
    client_max_body_size 32m;

    # ---- Страницы -------------------------------------------------------
    # Сайт собран с trailingSlash: 'always', каждая страница лежит папкой
    # с index.html внутри.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Приём заявок ---------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заявка с фотографиями грузится долго, особенно с мобильного
        # интернета: обрывать её на середине нельзя.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # ---- Кэш ------------------------------------------------------------
    # У файлов в _astro/ отпечаток в имени: меняется файл — меняется имя.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Имена шрифтов постоянные, поэтому год, но без immutable: замена файла
    # должна доходить до людей.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    # HTML не кэшируем, иначе после выкладки сутки видно старое.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- Сжатие ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # woff2 уже сжат, второй проход только греет процессор.

    # ---- Закрытое -------------------------------------------------------
    # Редактор контента на боевом сервере не нужен: он пишет правки
    # коммитами в GitHub и без OAuth-посредника всё равно не пустит внутрь.
    location /admin/ {
        return 404;
    }

    # Данные заявок лежат вне root, но пусть будет и явный запрет.
    location /data/ {
        deny all;
    }
}
